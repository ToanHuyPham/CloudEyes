[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudeyes-core"
version = "0.1.0.dev0"
description = "Deterministic models and analysis logic for CloudEyes"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["cloudeyes_core*"]
