[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudeyes"
version = "0.1.0.dev0"
description = "Evidence-based cloud provider assessment framework"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23",
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.scripts]
cloudeyes = "cloudeyes_agent.cli:main"
cloudeyes-ingestion = "cloudeyes_platform.cli:main"

[tool.setuptools.package-dir]
cloudeyes_core = "core/cloudeyes_core"
cloudeyes_agent = "agent/cloudeyes_agent"

[tool.setuptools.packages.find]
where = ["core", "agent", "platform"]
include = ["cloudeyes_core*", "cloudeyes_agent*", "cloudeyes_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core", "agent", "platform"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
