[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudeyes-agent"
version = "0.1.0.dev0"
description = "Privacy-safe local discovery and measurement agent for CloudEyes"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
cloudeyes = "cloudeyes_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cloudeyes_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
