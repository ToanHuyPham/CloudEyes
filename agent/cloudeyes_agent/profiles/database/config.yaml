name: database-config
version: 1
status: implemented
engine: sqlite
defaults:
  record_count: 2000
  payload_bytes: 256
  connection_operations: 15
  point_read_operations: 500
  insert_operations: 100
  update_operations: 100
  mixed_operations: 1000
  mixed_read_percent: 80
  concurrency: 4
  warmup_operations: 100
  repetitions: 3
  busy_timeout_seconds: 5
  random_seed: 20260806
  journal_mode: wal
  synchronous: full
safety:
  temporary_database_only: true
  maximum_seed_payload_bytes: 134217728
  maximum_total_operations: 500000
  maximum_concurrency: 32
  existing_database_paths: forbidden
