name: web-config
version: 1
status: implemented
defaults:
  target_url: https://example.com/
  scope: public
  request_count: 40
  concurrency: 4
  warmup_requests: 4
  timeout_seconds: 10
  max_response_bytes: 2097152
  verify_tls: true
safety:
  method: GET
  credentials_in_url: forbidden
  request_body: none
  maximum_requests: 1000
  maximum_concurrency: 64
  maximum_response_bytes_per_request: 16777216
  maximum_bounded_response_workload_bytes: 536870912
